# Codemagic — builda o iOS (.ipa) num Mac na nuvem e publica no TestFlight.
#
# PRÉ-REQUISITOS (você faz, uma vez):
#   1. App Store Connect > app criado com o bundle id  br.app.jurandir
#   2. App Store Connect > Usuários e Acesso > Integrações > gere uma API Key
#      com papel "App Manager"/"Admin". Baixe o .p8, anote Key ID + Issuer ID.
#   3. Codemagic > Team > Integrations > App Store Connect > adicione a chave com
#      o nome  Jurandir ASC  (igual em `integrations > app_store_connect`).
#   4. TestFlight > distribuição é feita na tela (interno instantâneo; externo
#      por e-mail/link após a Beta Review). Não precisa de grupo pro build subir.
#
# Assinatura: modo AUTOMÁTICO do Codemagic (bloco `ios_signing`). Ele cria e
# gerencia o certificado de distribuição (com a chave privada) + o provisioning
# profile via a API Key, e reutiliza entre builds. É o jeito certo em CI — sem
# depender de um certificado externo cuja chave privada não temos.

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Jurandir ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.app.jurandir
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=dart_defines.prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
