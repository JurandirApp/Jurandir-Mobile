# Codemagic — builda o iOS (.ipa) num Mac na nuvem e publica no TestFlight.
#
# PRÉ-REQUISITOS (você faz, uma vez):
#   1. App Store Connect > app criado com o bundle id  br.app.jurandir
#   2. Codemagic > Integrations > App Store Connect > API Key com o nome
#      Jurandir ASC  (papel App Manager/Admin).
#   3. Codemagic > App settings > Environment variables > grupo `ios_signing` com
#      a variável CERTIFICATE_PRIVATE_KEY (a chave privada PEM que geramos),
#      marcada como Secure. Ela permite CRIAR o certificado de distribuição — a
#      conta não tinha nenhum — e reutilizá-lo em todo build.
#   4. TestFlight > distribuição é feita na tela (interno instantâneo; externo
#      por e-mail/link após a Beta Review). Não precisa de grupo pro build subir.

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Jurandir ASC
    environment:
      groups:
        - ios_signing            # contém CERTIFICATE_PRIVATE_KEY (Secure)
      vars:
        BUNDLE_ID: "br.app.jurandir"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inicializa keychain
        script: keychain initialize
      - name: Cria/baixa certificado + perfil (App Store Connect)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Instala o certificado no keychain
        script: keychain add-certificates
      - name: Aplica os perfis no projeto Xcode
        script: xcode-project use-profiles
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=dart_defines.prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Diagnóstico: abre o app num simulador iOS e detecta crash de abertura.
  # NÃO assina, NÃO envia nada pra Apple. Serve só pra achar o plugin culpado
  # (ex.: o crash "unrecognized selector synchronize" do iOS 27 / UIScene).
  # Rode este workflow no Codemagic e leia o log: a exceção mostra a classe culpada.
  ios-smoke:
    name: iOS - Smoke test (diagnostico de crash na abertura)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "br.app.jurandir"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build pro simulador + abre e captura o crash
        script: |
          set -uo pipefail
          flutter build ios --simulator --debug \
            --dart-define-from-file=dart_defines.prod.json
          APP=$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' | head -n1)
          echo "App bundle: $APP"
          # pega o device mais novo disponivel (prefere iPad, p/ espelhar a Apple)
          UDID=$(xcrun simctl list devices available | grep -i ipad | grep -Eo '[0-9A-F-]{36}' | head -n1)
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -n1)
          echo "Simulador UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" "$APP"
          rm -f ~/Library/Logs/DiagnosticReports/Runner-*.ips 2>/dev/null || true
          # lanca em background capturando o console (a excecao ObjC sai aqui, com o nome REAL da classe)
          ( xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > /tmp/launch.log 2>&1 ) &
          sleep 25
          echo "===================== LOG DE ABERTURA ====================="
          cat /tmp/launch.log 2>/dev/null || echo "(sem log)"
          echo "===================== CRASH REPORTS ======================="
          for f in $(find ~/Library/Logs/DiagnosticReports -name 'Runner-*.ips' -mmin -3 2>/dev/null); do
            echo "----- $f -----"; cat "$f"
          done
          echo "==========================================================="
          if grep -qi "uncaught exception\|unrecognized selector" /tmp/launch.log 2>/dev/null; then
            echo "CRASHOU NA ABERTURA -> veja a excecao acima (nome da classe culpada)"
            exit 1
          fi
          echo "App abriu no simulador sem crashar."
