# Codemagic — builda o iOS (.ipa) num Mac na nuvem e publica no TestFlight.
#
# PRÉ-REQUISITOS (você faz, uma vez):
#   1. App Store Connect > app criado com o bundle id  br.app.jurandir
#   2. App Store Connect > Usuários e Acesso > Integrações > API do App Store
#      Connect > gere uma chave com papel "App Manager" (ou Admin) — precisa
#      desse papel pra CRIAR certificado + perfil. Baixe o .p8, anote Key ID +
#      Issuer ID.
#   3. Codemagic > Team > Integrations > App Store Connect > adicione a chave e
#      dê o nome  Jurandir ASC  (igual em `integrations > app_store_connect`).
#   4. TestFlight > crie o grupo externo  Socios  (usado em publishing).

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Jurandir ASC
    environment:
      vars:
        BUNDLE_ID: "br.app.jurandir"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inicializa keychain (assinatura)
        script: keychain initialize
      - name: Busca/cria certificado + perfil (App Store Connect)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Instala o certificado no keychain
        script: keychain add-certificates
      - name: Aplica os perfis no projeto Xcode
        script: xcode-project use-profiles
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=dart_defines.prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Socios
